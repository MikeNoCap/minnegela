# Local development overlay: exposes Postgres, adds MinIO with the same S3 layout R2 uses.
# podman compose -f infra/compose.yml -f infra/compose.dev.yml up -d postgres minio minio-init
services:
  postgres:
    ports: ["5432:5432"]

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minnegela}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minnegela-dev-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minnegela} ${S3_SECRET_ACCESS_KEY:-minnegela-dev-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-minnegela-media} &&
      echo bucket ready"

  # In dev the workers talk to MinIO on the host network; override the endpoint.
  api:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
  media-worker:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
    devices: []
  ml-worker:
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      ML_DEVICE: cpu
    devices: []

volumes:
  miniodata:
